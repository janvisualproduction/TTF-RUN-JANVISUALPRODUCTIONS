<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0f19" />
  <!-- Diamond shapes -->
  <g filter="url(#glow)">
    <polygon points="32,8 54,24 32,56 10,24" fill="url(#gemGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="32,8 44,24 32,28 20,24" fill="url(#facetTop)" />
    <polygon points="20,24 32,28 32,56 10,24" fill="#0284c7" opacity="0.7" />
    <polygon points="44,24 32,28 32,56 54,24" fill="#0ea5e9" opacity="0.85" />
    <!-- Sparkle -->
    <circle cx="24" cy="18" r="2.5" fill="#ffffff" />
    <circle cx="40" cy="36" r="1.5" fill="#ffffff" />
  </g>
</svg>